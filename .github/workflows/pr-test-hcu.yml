name: PR Test (HCU)

on:
    # Run the workflow file from the base branch so PRs cannot alter the CI definition.
    # pull_request is the event validated on the ARC pools (ARC runbook 2.14);
    # pull_request_target has never been exercised there.
    pull_request_target:
        branches:
          - v0.19.7-dev
        types: [labeled]
        # PRs that only touch CI config need no run; touching any other file still runs.
        paths-ignore:
          - '.github/**'
    workflow_dispatch:
        inputs:
            pr-number:
                description: 'PR number to merge into the selected branch (leave empty to test the branch as-is)'
                required: false
                default: ''
            torch-version:
                description: 'Torch version to test'
                required: false
                default: '2.13.0'
            transformers-version:
                description: 'transformers version to pin (keep in sync with .github/scripts/test.sh)'
                required: false
                default: '5.18.0'
            image:
                description: 'docker image'
                required: false
                default: ''

    # cron is UTC: 16:00 UTC is midnight Beijing time.
    schedule:
        - cron: '0 16 * * *'

permissions:
    contents: read

concurrency:
  # A new PR commit supersedes the old validation run of the same PR; manual runs never cancel each other.
  group: pr-test-hcu-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
    # The nightly full suite takes about 6 hours, so skip it when nothing was merged that day,
    # but still run it once every 7 idle days to catch environment drift (DTK, pip packages, runner).
    # Bookkeeping only: this runs on the CPU pool with no container, so it never waits for a card.
    decide:
        name: Decide whether to run
        runs-on: hygon-cpu
        outputs:
            run: ${{ steps.check.outputs.run }}
        steps:
            - name: Check for recent merges
              id: check
              uses: actions/github-script@v7
              with:
                script: |
                  if (context.eventName !== 'schedule') {
                    core.setOutput('run', 'true');
                    return;
                  }
                  // Scheduled runs always use the default branch.
                  const branch = context.ref.replace('refs/heads/', '');
                  const { data } = await github.rest.repos.getBranch({ ...context.repo, branch });
                  const lastCommit = new Date(data.commit.commit.committer.date);
                  const idleDays = Math.floor((Date.now() - lastCommit.getTime()) / 86400000);
                  // idleDays == 0: something was merged in the last 24 hours.
                  // idleDays % 7 == 0: the branch has been idle for a whole number of weeks.
                  const shouldRun = idleDays === 0 || idleDays % 7 === 0;
                  core.info(`Last commit on ${branch}: ${lastCommit.toISOString()}, idle ${idleDays} day(s), run=${shouldRun}`);
                  core.setOutput('run', String(shouldRun));

    # Compiling needs no card and wants many cores, so it belongs on hygon-build instead of
    # occupying a card pool for its whole duration.
    build:
        name: Build wheel
        needs: decide
        # PR runs only start after a maintainer adds the `run-ci` label; manual dispatch
        # and nightly runs are trusted and do not need it.
        if: >-
            needs.decide.outputs.run == 'true' &&
            (github.event_name != 'pull_request_target' ||
             github.event.label.name == 'run-ci')
        runs-on: hygon-build
        # Compiling plus the full dependency install. The pool's own 15-minute resource wait
        # is counted separately by the scheduler.
        timeout-minutes: 120
        container:
            # The job template injects /dev/kfd, /dev/dri/renderD* and /opt/hyhal, and the
            # arc-runners namespace rejects privileged pods. Do not add --privileged, --device,
            # --ipc=host or hostPath volumes here.
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        steps:
            # PR runs test the latest base branch with the PR head merged on top by
            # setup_hcu.sh; dispatch uses the branch picked in the UI (plus pr-number when given).
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Build wheel
              shell: bash
              run: bash .github/scripts/compile.sh

            # Each test job runs in its own container with no shared state, so the wheel has
            # to travel as an artifact.
            - name: Upload wheel
              uses: actions/upload-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist/*.whl
                retention-days: 1

    # PR validation runs the smoke subset only: the full suite takes hours and belongs to
    # the nightly. run_test_smoke.sh includes unit/comm/test_dist.py::TestInit, whose
    # world_size is 3, so it needs the 4-card pool (the smallest one with at least 3 cards).
    smoke:
        name: Smoke (4 card)
        needs: [decide, build]
        if: needs.decide.outputs.run == 'true' && github.event_name == 'pull_request_target'
        runs-on: hygon-bw1100-4card
        timeout-minutes: 60
        container:
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        env:
            HIP_VISIBLE_DEVICES: 0,1,2,3
            CUDA_VISIBLE_DEVICES: 0,1,2,3
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                # Triton compiles HSACO at test time, so every card job needs the toolchain,
                # not just the build job.
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist

            # Test jobs need the Python dependencies but must not rebuild the operators.
            # compile.sh installs an unpinned transformers, so pin it back to the version the
            # suite is validated against; results are not comparable across arbitrary releases.
            - name: Install dependencies and wheel
              shell: bash
              env:
                TRANSFORMERS_VERSION: ${{ github.event.inputs.transformers-version || '5.18.0' }}
              run: |
                set -eu
                source /opt/dtk/env.sh
                bash .github/scripts/compile.sh --deps-only
                pip install "transformers==${TRANSFORMERS_VERSION}"
                pip install dist/*.whl

            - name: Run smoke tests
              shell: bash
              run: |
                source /opt/dtk/env.sh
                bash tests/run_test_smoke.sh

    # Full suite, split by card count. run_test_<N>gpu.sh holds the targets whose maximum
    # world_size is N (the 3-GPU targets are folded into run_test_4gpu.sh), and the
    # 1-GPU/2-GPU buckets are further split into shard scripts that matrix runs in
    # parallel (the split lives in tests/gen_run_test_buckets.py; keep both sides in sync).
    # Shard counts stay within each pool's maxRunners: extra shards would only queue.
    #   1card  197 targets, maxRunners 8 -> 2 shards
    #   2card   62 targets, maxRunners 2 -> 2 shards
    #   4card   26 targets, maxRunners 2 -> one job (3-GPU targets ride along)
    #   8card    5 targets, maxRunners 1 -> one job
    test-1card:
        name: Test (1 card, ${{ matrix.shard }})
        needs: [decide, build]
        if: needs.decide.outputs.run == 'true' && github.event_name != 'pull_request_target'
        runs-on: hygon-bw1100-1card
        timeout-minutes: 3600
        strategy:
            # A failing shard must not cancel its siblings: the point of splitting is that
            # every target still reports a result.
            fail-fast: false
            matrix:
                shard: ['1', '2']
        container:
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        env:
            HIP_VISIBLE_DEVICES: 0
            CUDA_VISIBLE_DEVICES: 0
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist

            - name: Install dependencies and wheel
              shell: bash
              env:
                TRANSFORMERS_VERSION: ${{ github.event.inputs.transformers-version || '5.18.0' }}
              run: |
                set -eu
                source /opt/dtk/env.sh
                bash .github/scripts/compile.sh --deps-only
                pip install "transformers==${TRANSFORMERS_VERSION}"
                pip install dist/*.whl

            - name: Run tests
              shell: bash
              run: |
                source /opt/dtk/env.sh
                cp tests/torch_compile/ds_config_z3_deepcompile_no_persist.json tests/torch_compile/
                bash tests/run_test_1gpu_${{ matrix.shard }}.sh

            # The two targets that need an older transformers version swap it in
            # themselves at the end of the last 1-GPU shard (see gen_run_test_buckets.py).
            # The bucket scripts skip themselves when the pod has fewer cards than they
            # need, and exit non-zero if any of their targets failed.
            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                # upload-artifact v4 requires a unique name per job.
                name: hcu-test-reports-1card-shard${{ matrix.shard }}-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
                if-no-files-found: ignore

    test-2card:
        name: Test (2 card, ${{ matrix.shard }})
        needs: [decide, build]
        if: needs.decide.outputs.run == 'true' && github.event_name != 'pull_request_target'
        runs-on: hygon-bw1100-2card
        timeout-minutes: 3600
        strategy:
            fail-fast: false
            matrix:
                shard: ['1', '2']
        container:
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        env:
            HIP_VISIBLE_DEVICES: 0,1
            CUDA_VISIBLE_DEVICES: 0,1
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist

            - name: Install dependencies and wheel
              shell: bash
              env:
                TRANSFORMERS_VERSION: ${{ github.event.inputs.transformers-version || '5.18.0' }}
              run: |
                set -eu
                source /opt/dtk/env.sh
                bash .github/scripts/compile.sh --deps-only
                pip install "transformers==${TRANSFORMERS_VERSION}"
                pip install dist/*.whl

            - name: Run tests
              shell: bash
              run: |
                source /opt/dtk/env.sh
                sed -i 's/reuse_dist_env = True/reuse_dist_env = False/' \
                "tests/unit/runtime/zero/test_zero_tensor_fragment.py"
                bash tests/run_test_2gpu_${{ matrix.shard }}.sh

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: hcu-test-reports-2card-shard${{ matrix.shard }}-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
                if-no-files-found: ignore

    test-4card:
        name: Test (3-4 card)
        needs: [decide, build]
        if: needs.decide.outputs.run == 'true' && github.event_name != 'pull_request_target'
        runs-on: hygon-bw1100-4card
        timeout-minutes: 3600
        container:
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        env:
            HIP_VISIBLE_DEVICES: 0,1,2,3
            CUDA_VISIBLE_DEVICES: 0,1,2,3
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist

            - name: Install dependencies and wheel
              shell: bash
              env:
                TRANSFORMERS_VERSION: ${{ github.event.inputs.transformers-version || '5.18.0' }}
              run: |
                set -eu
                source /opt/dtk/env.sh
                bash .github/scripts/compile.sh --deps-only
                pip install "transformers==${TRANSFORMERS_VERSION}"
                pip install dist/*.whl

            # No 3-card pool exists; the 3-GPU targets are folded into run_test_4gpu.sh.
            - name: Run tests
              shell: bash
              run: |
                source /opt/dtk/env.sh
                bash tests/run_test_4gpu.sh

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: hcu-test-reports-4card-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
                if-no-files-found: ignore

    # The 8-card pool caps at a single Runner, so its targets run one after another.
    test-8card:
        name: Test (8 card)
        needs: [decide, build]
        if: needs.decide.outputs.run == 'true' && github.event_name != 'pull_request_target'
        runs-on: hygon-bw1100-8card
        timeout-minutes: 360
        container:
            image: ${{ inputs.image || vars.IMAGE_DTK2610 }}
        env:
            HIP_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
            CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
        steps:
            - name: Checkout base branch
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.pull_request.base.ref || github.ref }}
                fetch-depth: 0
                # Keep the token out of .git/config so PR code cannot read it. The PR
                # head is merged on top by setup_hcu.sh.
                persist-credentials: false

            - name: Setup HCU environment
              shell: bash
              env:
                PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
                TORCH_VERSION: ${{ github.event.inputs.torch-version || '2.13.0' }}
                DEVPI_URL: ${{ vars.DEVPI_URL }}
                PIP_TRUSTED_HOST: ${{ vars.PIP_TRUSTED_HOST }}
                INSTALL_COMPILER: 'true'
                GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/setup_hcu.sh

            - name: Download wheel
              uses: actions/download-artifact@v4
              with:
                name: deepspeed-wheel
                path: dist

            - name: Install dependencies and wheel
              shell: bash
              env:
                TRANSFORMERS_VERSION: ${{ github.event.inputs.transformers-version || '5.18.0' }}
              run: |
                set -eu
                source /opt/dtk/env.sh
                bash .github/scripts/compile.sh --deps-only
                pip install "transformers==${TRANSFORMERS_VERSION}"
                pip install dist/*.whl

            - name: Run tests
              shell: bash
              run: |
                source /opt/dtk/env.sh
                bash tests/run_test_8gpu.sh

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: hcu-test-reports-8card-${{ github.run_id }}
                path: ${{ env.REPORTS_DIR }}
                if-no-files-found: ignore
